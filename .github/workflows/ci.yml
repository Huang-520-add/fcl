name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MinGW（Windows 交叉工具链）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: 编译（C++17 严格模式）
        shell: bash
        run: |
          SRCS="src/main.cpp src/ecology.cpp src/expr.cpp src/parser.cpp src/interpreter.cpp"
          if [ "$RUNNER_OS" = "Windows" ]; then
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -o fcl.exe $SRCS
          else
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -o fcl $SRCS
          fi

      - name: 全量测试（22 用例）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=fcl.exe
          else
            EXE=fcl
          fi
          pass=0; fail=0
          for f in examples/*.fc; do
            if ./$EXE "$f" >/dev/null 2>&1; then ec=0; else ec=1; fi
            case "$f" in
              *err_*|*control_season_dry*) want=1 ;;
              *) want=0 ;;
            esac
            if [ "$ec" -eq "$want" ]; then pass=$((pass+1)); else fail=$((fail+1)); echo "FAIL: $f"; fi
          done
          echo "测试通过: $pass / 失败: $fail"
          [ "$fail" -eq 0 ]

      - name: 示例冒烟（可见输出验证）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=fcl.exe
          else
            EXE=fcl
          fi
          ./$EXE examples/plus1_visible.fc | grep -q 'U+0032'
          ./$EXE examples/example3.fc | grep -q 'U+0041'
